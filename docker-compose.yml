version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gold_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jewellery_gold_db}
      POSTGRES_USER: ${POSTGRES_USER:-gold_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gold_secure_password_coimbatore_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gold_admin} -d ${POSTGRES_DB:-jewellery_gold_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gold_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jewellery_gold_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gold_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-gold_secure_password_coimbatore_2026}
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: gold_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gold_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
